<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <title>Nova notificação</title>
</head>

<body>
<h1>Nova notificação</h1>

<form th:action="@{/notifications}"
      th:object="${form}"
      method="post">

    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="error : ${#fields.globalErrors()}"
           th:text="${error}">
        </p>
    </div>

    <div>
        <label for="recipients">Destinatários</label>

        <small id="recipients-help">
            (Separa os endereços por ponto e vírgula)
        </small>

        <br>
        <input type="text"
               id="recipients"
               th:field="*{recipients}"
               placeholder="ana@example.com; pedro@example.com"
               aria-describedby="recipients-help"
               required>

        <p th:if="${#fields.hasErrors('recipients')}"
           th:errors="*{recipients}"></p>
    </div>

    <div>
        <label for="subject">Assunto</label>
        <br>
        <input type="text"
               id="subject"
               th:field="*{subject}"
               maxlength="255"
               required>

        <p th:if="${#fields.hasErrors('subject')}"
           th:errors="*{subject}"></p>
    </div>

    <div>
        <label for="content">Conteúdo</label>
        <br>
        <textarea id="content"
                  th:field="*{content}"
                  rows="8"
                  required></textarea>

        <p th:if="${#fields.hasErrors('content')}"
           th:errors="*{content}"></p>
    </div>

    <button type="submit">Enviar notificação</button>
</form>

<p>
    <a th:href="@{/notifications}">Voltar à listagem</a>
</p>
</body>
</html>
